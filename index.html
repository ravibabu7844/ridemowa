<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RideMowa</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#090909;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:520px;margin:auto;min-height:100vh;background:#0b0b0b}.top{padding:22px 18px;background:#ffd21c;color:#111;font-weight:900;font-size:24px}.card{margin:14px;padding:18px;background:#171717;border-radius:20px}.input,select{width:100%;padding:15px;margin:7px 0;border:1px solid #333;border-radius:14px;background:#222;color:#fff}.btn{width:100%;padding:15px;border:0;border-radius:14px;background:#ffd21c;color:#111;font-weight:800;margin-top:8px}.ghost{background:#292929;color:#fff}.tabs{display:flex;gap:8px}.tabs button{flex:1}.hide{display:none}.ride{padding:13px;background:#222;border-radius:14px;margin:9px 0}.status{color:#ffd21c;font-weight:800}.small{font-size:13px;color:#aaa}.nav{position:sticky;bottom:0;display:flex;background:#111;border-top:1px solid #333;padding-bottom:env(safe-area-inset-bottom)}.nav button{flex:1;background:none;color:#bbb;border:0;padding:15px 4px}.nav .on{color:#ffd21c}.hero{height:190px;background:linear-gradient(145deg,#2b2b2b,#111);display:flex;align-items:end;padding:18px;font-size:27px;font-weight:900}.pill{display:inline-block;padding:8px 11px;background:#292929;border-radius:20px;margin:4px}
</style></head><body><div class="wrap">
<div class="top">RideMowa</div>
<section id="auth" class="card"><h2>Welcome</h2><input id="email" class="input" placeholder="Email"><input id="pass" type="password" class="input" placeholder="Password"><button class="btn" onclick="login()">Login</button><button class="btn ghost" onclick="signup()">Create account</button><p id="msg" class="small"></p></section>
<div id="app" class="hide">
<div class="hero">Where do you want to go?</div>
<section id="rider" class="card"><h2>Book a ride</h2><input id="pickup" class="input" placeholder="Pickup location"><input id="drop" class="input" placeholder="Destination"><select id="vehicle"><option>Bike</option><option>Auto</option><option>Car</option></select><div><span class="pill">Cash</span><span class="pill">OTP protected</span></div><button class="btn" onclick="book()">Book Ride</button><p id="fare" class="small">Estimated fare is calculated for MVP.</p></section>
<section id="captain" class="card hide"><h2>Captain Dashboard</h2><button class="btn" onclick="online()">Go Online + Share GPS</button><button class="btn ghost" onclick="loadOpen()">Refresh Requests</button><div id="openrides"></div></section>
<section class="card"><div class="tabs"><button class="btn ghost" onclick="mode('rider')">Rider</button><button class="btn ghost" onclick="mode('captain')">Captain</button></div><h3>My rides</h3><div id="rides"></div><button class="btn ghost" onclick="logout()">Logout</button></section>
<div class="nav"><button class="on">Ride</button><button>Services</button><button>Travel</button><button>Profile</button></div>
</div></div>
<script>
const S=supabase.createClient('https://eqreopqvemrpxeiwbost.supabase.co','sb_publishable_PyzyCqh5lPb8HooEj54MfQ_Me7z2llY');
let user=null;
async function init(){let {data}=await S.auth.getSession();user=data.session?.user;if(user)show()}
async function login(){let {data,error}=await S.auth.signInWithPassword({email:email.value,password:pass.value});msg.textContent=error?.message||'';if(data.user){user=data.user;show()}}
async function signup(){let {data,error}=await S.auth.signUp({email:email.value,password:pass.value,options:{data:{display_name:email.value.split('@')[0]}}});msg.textContent=error?.message||'Account created. Check email if confirmation is enabled.';if(data.session){user=data.user;show()}}
function show(){auth.classList.add('hide');app.classList.remove('hide');gps();loadRides()}
function gps(){navigator.geolocation?.getCurrentPosition(p=>{pickup.value=`Current location (${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)})`;pickup.dataset.lat=p.coords.latitude;pickup.dataset.lng=p.coords.longitude})}
async function book(){if(!pickup.value||!drop.value)return alert('Enter pickup and destination');let v=vehicle.value,base=v==='Bike'?60:v==='Auto'?100:180,otp=String(Math.floor(1000+Math.random()*9000));let {error}=await S.from('rides').insert({rider_id:user.id,pickup_text:pickup.value,pickup_lat:+pickup.dataset.lat||null,pickup_lng:+pickup.dataset.lng||null,drop_text:drop.value,vehicle_type:v,base_fare:base,final_fare:base,trip_otp:otp});if(error)return alert(error.message);alert('Ride requested. OTP: '+otp);loadRides()}
async function loadRides(){let {data}=await S.from('rides').select('*').order('created_at',{ascending:false}).limit(20);rides.innerHTML=(data||[]).map(r=>`<div class="ride"><b>${r.vehicle_type} · ₹${r.final_fare}</b><div>${r.pickup_text} → ${r.drop_text}</div><div class="status">${r.status}</div>${r.status!=='completed'?`<div class="small">OTP: ${r.trip_otp}</div>`:''}</div>`).join('')||'<p class="small">No rides yet.</p>'}
function mode(x){rider.classList.toggle('hide',x!=='rider');captain.classList.toggle('hide',x!=='captain');if(x==='captain')loadOpen()}
async function online(){navigator.geolocation?.getCurrentPosition(async p=>{let {error}=await S.rpc('set_captain_availability',{p_online:true,p_lat:p.coords.latitude,p_lng:p.coords.longitude});alert(error?error.message:'Captain online')})}
async function loadOpen(){let {data,error}=await S.rpc('get_open_rides');openrides.innerHTML=error?`<p>${error.message}</p>`:(data||[]).map(r=>`<div class="ride"><b>${r.vehicle_type} ₹${r.final_fare}</b><div>${r.pickup_text} → ${r.drop_text}</div><button class="btn" onclick="acceptRide('${r.id}')">Accept</button></div>`).join('')||'<p class="small">No matching requests.</p>'}
async function acceptRide(id){let {error}=await S.rpc('accept_ride',{p_ride_id:id});alert(error?error.message:'Ride accepted');loadOpen();loadRides()}
async function logout(){await S.auth.signOut();location.reload()}
init();
</script></body></html>
